[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vervain-evidence-verifier"
version = "0.1.0"
description = "Independent, deterministic verifier, sanitizer, run-provenance checker, and adversarial mutation harness for Vervain inference-security artifacts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "cryptography>=42.0.0",
  "jsonschema>=4.20.0",
]

[project.scripts]
evidence-verifier = "evidence_verifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
